<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{layout/admin-layout :: admin-layout(title='Vehículos', content=~{::content})}">
    <th:block th:ref="content">

        <!-- ── HEADER DE PÁGINA ───────────────────────────────────────── -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white">Vehículos</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Gestiona los vehículos registrados en el parqueadero</p>
            </div>
            <button onclick="openCreateModal()"
                    class="flex items-center gap-2 px-4 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
                <span class="material-symbols-outlined text-[18px]">add</span>
                Nuevo vehículo
            </button>
        </div>

        <!-- ── TABLA ──────────────────────────────────────────────────── -->
        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">

            <!-- Empty state -->
            <div th:if="${isEmpty}" class="flex flex-col items-center justify-center py-16 text-center">
                <span class="material-symbols-outlined text-5xl text-slate-300 mb-3">no_crash</span>
                <p class="text-slate-500 font-medium">No hay vehículos registrados</p>
                <p class="text-slate-400 text-sm mt-1">Registra el primer vehículo con el botón de arriba</p>
            </div>

            <!-- Table -->
            <div th:if="${!isEmpty}" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50">
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Placa</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Tipo</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Marca / Color</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Cliente</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Estado</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vehicle : ${vehicles}"
                        class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">

                        <!-- Placa -->
                        <td class="px-5 py-3">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 font-mono font-bold text-slate-800 dark:text-white text-sm tracking-wider"
                                  th:text="${vehicle.plate}">ABC123</span>
                        </td>

                        <!-- Tipo -->
                        <td class="px-5 py-3">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px]"
                                      th:text="${vehicle.type.name() == 'CAR' ? 'directions_car' :
                                                vehicle.type.name() == 'MOTORCYCLE' ? 'two_wheeler' :
                                                vehicle.type.name() == 'BICYCLE' ? 'pedal_bike' : 'local_shipping'}">
                                    directions_car
                                </span>
                                <span class="text-slate-600 dark:text-slate-300"
                                      th:text="${vehicle.type.name() == 'CAR' ? 'Carro' :
                                                vehicle.type.name() == 'MOTORCYCLE' ? 'Moto' :
                                                vehicle.type.name() == 'BICYCLE' ? 'Bicicleta' : 'Camión'}">
                                    Carro
                                </span>
                            </div>
                        </td>

                        <!-- Marca / Color -->
                        <td class="px-5 py-3 text-slate-600 dark:text-slate-300">
                            <p th:text="${vehicle.brand ?: '—'}">Toyota</p>
                            <p class="text-xs text-slate-400" th:text="${vehicle.color ?: ''}">Rojo</p>
                        </td>

                        <!-- Cliente -->
                        <td class="px-5 py-3">
                            <p class="font-medium text-slate-800 dark:text-white"
                               th:text="${vehicle.clientName + ' ' + vehicle.clientLastName}">Cliente</p>
                            <p class="text-xs text-slate-400"
                               th:text="${vehicle.clientPhone}">300...</p>
                        </td>

                        <!-- Estado -->
                        <td class="px-5 py-3">
                            <span th:if="${vehicle.active}"
                                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                                <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
                                Activo
                            </span>
                            <span th:unless="${vehicle.active}"
                                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-600">
                                <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>
                                Inactivo
                            </span>
                        </td>

                        <!-- Acciones -->
                        <td class="px-5 py-3">
                            <div class="flex items-center gap-2">
                                <button th:attr="data-id=${vehicle.id}" th:onclick="openEditModel(this.dataset.id)"
                                        class="flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-primary transition-colors"
                                        title="Editar">
                                    <span class="material-symbols-outlined text-[18px]">edit</span>
                                </button>
                                <button th:attr="data-id=${vehicle.id}, data-active=${vehicle.active}" th:onclick="toggleVehicle(this.dataset.id, this.dataset.active === 'true')"
                                        th:class="${vehicle.active} ? 'flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-red-50 hover:text-red-500 transition-colors' : 'flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-green-50 hover:text-green-500 transition-colors'"
                                        th:title="${vehicle.active} ? 'Desactivar' : 'Activar'">
                                    <span class="material-symbols-outlined text-[18px]"
                                          th:text="${vehicle.active} ? 'block' : 'check_circle'">block</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── MODAL CREAR / EDITAR ───────────────────────────────────── -->
        <div id="vehicle-modal"
             class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 px-4">
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-md">

                <!-- Modal Header -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
                    <h3 id="modal-title" class="text-base font-semibold text-slate-800 dark:text-white">Nuevo vehículo</h3>
                    <button onclick="closeModal()"
                            class="flex items-center justify-center h-8 w-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-6 py-5 flex flex-col gap-4">

                    <input type="hidden" id="vehicle-id"/>

                    <!-- Buscar cliente por cédula -->
                    <div class="flex flex-col gap-1">
                        <label class="auth-label">Buscar cliente por cédula</label>
                        <div class="flex gap-2">
                            <input class="auth-input flex-1" id="search-nationalid"
                                   type="text" placeholder="Ingresa la cédula"/>
                            <button onclick="searchClient()"
                                    class="px-3 py-2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg hover:bg-slate-200 transition-colors">
                                <span class="material-symbols-outlined text-[18px]">search</span>
                            </button>
                        </div>
                        <!-- Cliente encontrado -->
                        <div id="client-found" class="hidden mt-1 px-3 py-2 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg">
                            <p class="text-sm font-medium text-green-700 dark:text-green-400" id="client-found-name"></p>
                            <p class="text-xs text-green-600 dark:text-green-500" id="client-found-phone"></p>
                        </div>
                        <input type="hidden" id="vehicle-client-id"/>
                    </div>

                    <!-- Placa -->
                    <div class="flex flex-col gap-1">
                        <label class="auth-label" for="vehicle-plate">Placa</label>
                        <input class="auth-input uppercase" id="vehicle-plate"
                               type="text" placeholder="Ej: ABC123"
                               oninput="this.value = this.value.toUpperCase()"/>
                    </div>

                    <!-- Tipo -->
                    <div class="flex flex-col gap-1">
                        <label class="auth-label" for="vehicle-type">Tipo de vehículo</label>
                        <select class="auth-input" id="vehicle-type">
                            <option value="">Selecciona un tipo</option>
                            <option value="CAR">🚗 Carro</option>
                            <option value="MOTORCYCLE">🏍️ Moto</option>
                            <option value="BICYCLE">🚲 Bicicleta</option>
                            <option value="TRUCK">🚛 Camión / Bus</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Marca -->
                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="vehicle-brand">Marca <span class="text-slate-400 font-normal">(opcional)</span></label>
                            <input class="auth-input" id="vehicle-brand" type="text" placeholder="Ej: Toyota"/>
                        </div>
                        <!-- Color -->
                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="vehicle-color">Color <span class="text-slate-400 font-normal">(opcional)</span></label>
                            <input class="auth-input" id="vehicle-color" type="text" placeholder="Ej: Rojo"/>
                        </div>
                    </div>

                </div>

                <!-- Modal Footer -->
                <div class="flex justify-end gap-3 px-6 py-4 border-t border-slate-200 dark:border-slate-700">
                    <button onclick="closeModal()"
                            class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        Cancelar
                    </button>
                    <button id="btn-save-vehicle" onclick="saveVehicle()"
                            class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-blue-600 transition-colors">
                        Guardar
                    </button>
                </div>
            </div>
        </div>

    </th:block>
</th:block>

<script th:src="@{/js/vehicles.js}"></script>

</html>
