<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{layout/admin-layout :: admin-layout(title='Clientes', content=~{::content})}">

    <th:block th:ref="content">

        <!-- ── HEADER DE PÁGINA ───────────────────────────────────────── -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white">Clientes</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Gestiona los clientes de tu parqueadero</p>
            </div>
            <button onclick="openCreateModal()"
                    class="flex items-center gap-2 px-4 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
                <span class="material-symbols-outlined text-[18px]">person_add</span>
                Nuevo cliente
            </button>
        </div>

        <!-- ── TABLA ──────────────────────────────────────────────────── -->
        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">

            <!-- Empty state -->
            <div th:if="${isEmpty}" class="flex flex-col items-center justify-center py-16 text-center">
                <span class="material-symbols-outlined text-5xl text-slate-300 mb-3">group_off</span>
                <p class="text-slate-500 font-medium">No hay clientes registrados</p>
                <p class="text-slate-400 text-sm mt-1">Crea el primer cliente con el botón de arriba</p>
            </div>

            <!-- Table -->
            <div th:if="${!isEmpty}" class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50">
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Cliente</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Cédula</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Teléfono</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Email</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Estado</th>
                        <th class="text-left px-5 py-3 font-semibold text-slate-600 dark:text-slate-300">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="client : ${clients}"
                        class="border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">

                        <!-- Nombre -->
                        <td class="px-5 py-3">
                            <div class="flex items-center gap-3">
                                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary/10 text-primary font-bold text-sm shrink-0"
                                     th:text="${client.name.substring(0,1).toUpperCase()}">A</div>
                                <div>
                                    <p class="font-medium text-slate-800 dark:text-white"
                                       th:text="${client.name + ' ' + client.lastName}">Nombre</p>
                                </div>
                            </div>
                        </td>

                        <!-- Cédula -->
                        <td class="px-5 py-3 text-slate-600 dark:text-slate-300"
                            th:text="${client.nationalId}">123456</td>

                        <!-- Teléfono -->
                        <td class="px-5 py-3 text-slate-600 dark:text-slate-300"
                            th:text="${client.phone}">300...</td>

                        <!-- Email -->
                        <td class="px-5 py-3 text-slate-600 dark:text-slate-300"
                            th:text="${client.email ?: '—'}">email</td>

                        <!-- Estado -->
                        <td class="px-5 py-3">
                            <span th:if="${client.active}"
                                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">
                                <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
                                Activo
                            </span>
                            <span th:unless="${client.active}"
                                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-600">
                                <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>
                                Inactivo
                            </span>
                        </td>

                        <!-- Acciones -->
                        <td class="px-5 py-3">
                            <div class="flex items-center gap-2">
                                <button th:attr="data-id=${client.id}" th:onclick="openEditModal(this.dataset.id)"
                                        class="flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-primary transition-colors"
                                        title="Editar">
                                    <span class="material-symbols-outlined text-[18px]">edit</span>
                                </button>
                                <button th:attr="data-id=${client.id},data-active=${client.active}" th:onclick="toggleClient(this.dataset.id, this.dataset.active === 'true')"
                                        th:class="${client.active} ? 'flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-red-50 hover:text-red-500 transition-colors' : 'flex items-center justify-center h-8 w-8 rounded-lg text-slate-500 hover:bg-green-50 hover:text-green-500 transition-colors'"
                                        th:title="${client.active} ? 'Desactivar' : 'Activar'">
                                    <span class="material-symbols-outlined text-[18px]"
                                          th:text="${client.active} ? 'block' : 'check_circle'">block</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ── MODAL CREAR / EDITAR ───────────────────────────────────── -->
        <div id="client-modal"
             class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 px-4">
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-md">

                <!-- Modal Header -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-700">
                    <h3 id="modal-title" class="text-base font-semibold text-slate-800 dark:text-white">Nuevo cliente</h3>
                    <button onclick="closeModal()"
                            class="flex items-center justify-center h-8 w-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="px-6 py-5 flex flex-col gap-4">

                    <input type="hidden" id="client-id"/>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="client-name">Nombres</label>
                            <input class="auth-input" id="client-name" type="text" placeholder="Ej: Carlos"/>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="client-lastname">Apellidos</label>
                            <input class="auth-input" id="client-lastname" type="text" placeholder="Ej: Pérez"/>
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="auth-label" for="client-nationalid">Cédula</label>
                        <input class="auth-input" id="client-nationalid" type="text" placeholder="Número de cédula"/>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="auth-label" for="client-phone">Teléfono</label>
                        <input class="auth-input" id="client-phone" type="text" placeholder="Ej: 3001234567"/>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="auth-label" for="client-email">Email <span class="text-slate-400 font-normal">(opcional)</span></label>
                        <input class="auth-input" id="client-email" type="email" placeholder="correo@email.com"/>
                    </div>

                </div>

                <!-- Modal Footer -->
                <div class="flex justify-end gap-3 px-6 py-4 border-t border-slate-200 dark:border-slate-700">
                    <button onclick="closeModal()"
                            class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        Cancelar
                    </button>
                    <button id="btn-save-client" onclick="saveClient()"
                            class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold hover:bg-blue-600 transition-colors">
                        Guardar
                    </button>
                </div>
            </div>
        </div>

    </th:block>
</th:block>

<script th:src="@{/js/admin_clients.js}"></script>

</html>
