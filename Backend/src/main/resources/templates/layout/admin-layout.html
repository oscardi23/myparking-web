<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- =====================================================
     FRAGMENT: Admin Sidebar Layout
     Uso: th:replace="layout/admin-layout :: admin-layout(title='Página', ~{::content})"
===================================================== -->

<div th:fragment="admin-layout(title, content)">


    <head th:replace="layout/head :: head-main(title=${title})"></head>
    <body class="bg-slate-50 dark:bg-slate-900 font-inter antialiased">

    <div class="flex h-screen overflow-hidden">

        <!-- ── SIDEBAR ────────────────────────────────────────────── -->
        <aside id="sidebar"
               class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white flex flex-col transition-transform duration-300 lg:relative lg:translate-x-0 -translate-x-full">

            <!-- Logo -->
            <div class="flex items-center gap-3 px-6 py-5 border-b border-white/10">
                <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/90 shadow-lg shadow-primary/30">
                    <span class="material-symbols-outlined text-2xl">local_parking</span>
                </div>
                <div>
                    <span class="block text-base font-bold tracking-tight">MyParking</span>
                    <span class="block text-[10px] font-medium text-slate-400 tracking-wider uppercase">Smart Parking</span>
                </div>
            </div>

            <!-- Nav Menu -->
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">

                <!-- Dashboard -->
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'">
                    <span class="material-symbols-outlined text-[20px]">dashboard</span>
                    Dashboard
                </a>

                <!-- Parking -->
                <a th:href="@{/admin/parking}"
                   th:classappend="${activeMenu == 'parking'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">garage</span>
                    Parqueadero
                </a>

                <!-- Separator -->
                <div class="pt-3 pb-1 px-3">
                    <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">Gestión</p>
                </div>

                <!-- Clients -->
                <a th:href="@{/admin/clients}"
                   th:classappend="${activeMenu == 'clients'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">group</span>
                    Clientes
                </a>

                <!-- Vehícles -->
                <a th:href="@{/admin/vehicles}"
                   th:classappend="${activeMenu == 'vehicles'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">directions_car</span>
                    Vehículos
                </a>

                <!-- Operator -->
                <a th:href="@{/admin/operators}"
                   th:classappend="${activeMenu == 'operators'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">badge</span>
                    Operadores
                </a>

                <!-- Separator -->
                <div class="pt-3 pb-1 px-3">
                    <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">Operación</p>
                </div>

                <!-- inputs / outputs  -->
                <a th:href="@{/operator/entries}"
                   th:classappend="${activeMenu == 'entries'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">swap_horiz</span>
                    Entradas / Salidas
                </a>

                <!-- Reports -->
                <a th:href="@{/admin/reports}"
                   th:classappend="${activeMenu == 'reports'} ? 'bg-primary text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                   class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200">
                    <span class="material-symbols-outlined text-[20px]">bar_chart</span>
                    Reportes
                </a>

            </nav>

            <!-- User Info + Logout -->
            <div class="border-t border-white/10 px-4 py-4">
                <div class="flex items-center gap-3 mb-3">
                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary/20 text-primary font-bold text-sm">
                        <!-- name-->
                        <span th:text="${#authentication.principal.fullName.substring(0,1).toUpperCase()}">A</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-white truncate"
                           th:text="${#authentication.principal.fullName}">Admin</p>
                        <p class="text-[11px] text-slate-400 truncate"
                           th:text="${#authentication.principal.username}">admin@mail.com</p>
                    </div>
                </div>
                <a th:href="@{/logout}"
                   class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-red-400 transition-all duration-200">
                    <span class="material-symbols-outlined text-[18px]">logout</span>
                    Cerrar sesión
                </a>
            </div>
        </aside>

        <!-- ── OVERLAY MOBILE ─────────────────────────────────────── -->
        <div id="sidebar-overlay"
             class="fixed inset-0 z-40 bg-black/50 hidden lg:hidden"
             onclick="toggleSidebar()">
        </div>

        <!-- ── MAIN CONTENT ───────────────────────────────────────── -->
        <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

            <!-- Header -->
            <header class="flex items-center justify-between h-16 px-4 lg:px-6 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shrink-0">

                <!-- Hamburger (mobile) -->
                <button onclick="toggleSidebar()"
                        class="lg:hidden flex items-center justify-center h-9 w-9 rounded-lg text-slate-500 hover:bg-slate-100 transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>

                <!-- Page Title -->
                <h1 class="text-base font-semibold text-slate-800 dark:text-white lg:ml-0 ml-3"
                    th:text="${title}">Dashboard</h1>

                <!-- Right side -->
                <div class="flex items-center gap-2">
                    <!-- name user header ( desktop) -->
                    <span class="flex items-center w-8 h-8  justify-center rounded-full bg-blue-600 text-white font-bold text-lg" th:text="${#strings.isEmpty(#authentication.principal.fullName) ? 'A' : #authentication.principal.fullName.substring(0,1).toUpperCase()}"></span>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-6">
                <th:block th:replace="${content}"/>
            </main>

        </div>
    </div>

    <!-- Toast global -->
    <div id="toast"
         class="fixed top-5 right-5 hidden px-4 py-3 rounded-lg shadow-lg text-white font-semibold transition-all z-50">
    </div>

    <script th:src="@{/js/taiwind-config.js}"></script>
    <script th:src="@{/js/admin_layout.js}"></script>

    </body>

</div>

</html>>
