<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{layout/admin-layout :: admin-layout(title='Parqueadero', content=~{::content})}">
    <th:block th:ref="content">

        <!-- ── HEADER ─────────────────────────────────────────────────── -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-white">Parqueadero</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Configura la información y tarifas de tu parqueadero</p>
            </div>
            <!-- Badge estado -->
             <span th:if="${!isNew and parking.active}"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-green-100 text-green-700">
            <span class="h-2 w-2 rounded-full bg-green-500"></span>
            Activo
        </span>
            <span th:if="${!isNew and !parking.active}"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-red-100 text-red-600">
            <span class="h-2 w-2 rounded-full bg-red-500"></span>
            Inactivo
        </span>
        </div>

        <!-- ── FORM ───────────────────────────────────────────────────── -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Columna principal -->
            <div class="lg:col-span-2 flex flex-col gap-6">

                <!-- Info básica -->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-white mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-primary">garage</span>
                        Información básica
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <div class="flex flex-col gap-1 sm:col-span-2">
                            <label class="auth-label" for="parking-name">Nombre del parqueadero</label>
                            <input class="auth-input" id="parking-name" type="text"
                                   placeholder="Ej: Parqueadero Central"
                                   th:value="${parking.name}"/>
                        </div>

                        <div class="flex flex-col gap-1 sm:col-span-2">
                            <label class="auth-label" for="parking-address">Dirección</label>
                            <input class="auth-input" id="parking-address" type="text"
                                   placeholder="Ej: Calle 10 # 5-30"
                                   th:value="${parking.address}"/>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="parking-phone">Teléfono</label>
                            <input class="auth-input" id="parking-phone" type="text"
                                   placeholder="Ej: 3001234567"
                                   th:value="${parking.phone}"/>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="auth-label" for="parking-nit">NIT</label>
                            <input class="auth-input" id="parking-nit" type="text"
                                   placeholder="Ej: 900123456-1"
                                   th:value="${parking.nit}"/>
                        </div>

                    </div>
                </div>

                <!-- Spots-->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-white mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-primary">grid_view</span>
                        Cupos disponibles
                    </h3>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

                        <div class="flex flex-col gap-1">
                            <label class="auth-label flex items-center gap-1" for="spots-car">
                                <span class="material-symbols-outlined text-[16px]">directions_car</span> Carros
                            </label>
                            <input class="auth-input text-center" id="spots-car" type="number" min="0"
                                   placeholder="0" th:value="${parking.totalSpotsCar}"/>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="auth-label flex items-center gap-1" for="spots-moto">
                                <span class="material-symbols-outlined text-[16px]">two_wheeler</span> Motos
                            </label>
                            <input class="auth-input text-center" id="spots-moto" type="number" min="0"
                                   placeholder="0" th:value="${parking.totalSpotsMotorcycle}"/>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="auth-label flex items-center gap-1" for="spots-bike">
                                <span class="material-symbols-outlined text-[16px]">pedal_bike</span> Bicicletas
                            </label>
                            <input class="auth-input text-center" id="spots-bike" type="number" min="0"
                                   placeholder="0" th:value="${parking.totalSpotsBicycle}"/>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="auth-label flex items-center gap-1" for="spots-truck">
                                <span class="material-symbols-outlined text-[16px]">local_shipping</span> Camiones
                            </label>
                            <input class="auth-input text-center" id="spots-truck" type="number" min="0"
                                   placeholder="0" th:value="${parking.totalSpotsTruck}"/>
                        </div>

                    </div>
                </div>

                <!-- Rates -->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-white mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-primary">payments</span>
                        Tarifas por tipo de vehículo
                    </h3>

                    <!-- Tabs types -->
                    <div class="flex gap-2 mb-5 border-b border-slate-200 dark:border-slate-700">
                        <button onclick="showRateTab('CAR')" id="tab-CAR"
                                class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-primary text-primary transition-colors">
                            🚗 Carros
                        </button>
                        <button onclick="showRateTab('MOTORCYCLE')" id="tab-MOTORCYCLE"
                                class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-colors">
                            🏍️ Motos
                        </button>
                        <button onclick="showRateTab('BICYCLE')" id="tab-BICYCLE"
                                class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-colors">
                            🚲 Bicicletas
                        </button>
                        <button onclick="showRateTab('TRUCK')" id="tab-TRUCK"
                                class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-colors">
                            🚛 Camiones
                        </button>
                    </div>

                    <!-- Panel CAR -->
                    <div id="rate-CAR" class="rate-panel grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa mínima</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-CAR-min" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).CAR)?.minimumRate}"/>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por hora</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-CAR-hour" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).CAR)?.hourlyRate}"/>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por día</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-CAR-day" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).CAR)?.dailyRate}"/>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Mensualidad</label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-CAR-month" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).CAR)?.monthlyRate}"/>
                            </div>
                        </div>
                    </div>

                    <!-- Panel MOTORCYCLE -->
                    <div id="rate-MOTORCYCLE" class="rate-panel hidden grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa mínima</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-MOTORCYCLE-min" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).MOTORCYCLE)?.minimumRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por hora</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-MOTORCYCLE-hour" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).MOTORCYCLE)?.hourlyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por día</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-MOTORCYCLE-day" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).MOTORCYCLE)?.dailyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Mensualidad</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-MOTORCYCLE-month" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).MOTORCYCLE)?.monthlyRate}"/></div>
                        </div>
                    </div>

                    <!-- Panel BICYCLE -->
                    <div id="rate-BICYCLE" class="rate-panel hidden grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa mínima</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-BICYCLE-min" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).BICYCLE)?.minimumRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por hora</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-BICYCLE-hour" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).BICYCLE)?.hourlyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por día</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-BICYCLE-day" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).BICYCLE)?.dailyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Mensualidad</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-BICYCLE-month" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).BICYCLE)?.monthlyRate}"/></div>
                        </div>
                    </div>

                    <!-- Panel TRUCK -->
                    <div id="rate-TRUCK" class="rate-panel hidden grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa mínima</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-TRUCK-min" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).TRUCK)?.minimumRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por hora</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-TRUCK-hour" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).TRUCK)?.hourlyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Tarifa por día</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-TRUCK-day" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).TRUCK)?.dailyRate}"/></div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="auth-label">Mensualidad</label>
                            <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                                <input class="auth-input pl-7" id="rate-TRUCK-month" type="number" min="0" placeholder="0"
                                       th:value="${parking.rates?.get(T(com.devsoft.myparking.models.VehicleType).TRUCK)?.monthlyRate}"/></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Column lateral -->
            <div class="flex flex-col gap-4">

                <!-- Saves -->
                <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-white mb-4">Guardar cambios</h3>
                    <input type="hidden" id="parking-id" th:value="${parking.id}"/>
                    <button onclick="saveParking()"
                            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-blue-600 transition-colors">
                        <span class="material-symbols-outlined text-[18px]">save</span>
                        <span id="btn-save-text" th:text="${isNew} ? 'Crear parqueadero' : 'Guardar cambios'">Guardar</span>
                    </button>
                </div>

                <!-- Enable / Disable -->
                <div th:if="${!isNew}"
                     class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5">
                    <h3 class="text-sm font-semibold text-slate-700 dark:text-white mb-1">Estado</h3>
                    <p class="text-xs text-slate-400 mb-4">Activa o desactiva el parqueadero</p>
                    <button onclick="toggleParking()"
                            th:class="${parking.active} ?
                            'w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm font-semibold hover:bg-red-100 transition-colors' :
                            'w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-green-50 text-green-600 border border-green-200 rounded-lg text-sm font-semibold hover:bg-green-100 transition-colors'">
                    <span class="material-symbols-outlined text-[18px]"
                          th:text="${parking.active} ? 'toggle_off' : 'toggle_on'">toggle_off</span>
                        <span th:text="${parking.active} ? 'Desactivar' : 'Activar'">Desactivar</span>
                    </button>
                </div>

            </div>
        </div>

    </th:block>
</th:block>

<script th:src="@{/js/admin-parking.js}"></script>

</html>
